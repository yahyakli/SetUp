version: '3.8'

services:
  # Databases
  user-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=userservicedb
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - user-db-data:/var/lib/mysql

  project-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=projectservicedb
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - project-db-data:/var/lib/mysql

  billing-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=billingservicedb
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - billing-db-data:/var/lib/mysql

  task-db:
    image: mongo:latest
    volumes:
      - task-db-data:/data/db

  chat-db:
    image: mongo:latest
    volumes:
      - chat-db-data:/data/db

  notification-db:
    image: mongo:latest
    volumes:
      - notification-db-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  # Backend Services
  user-service:
    build: ./services/UserService
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=user-db
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - user-db

  project-service:
    build: ./services/ProjectService
    environment:
      - DB_HOST=project-db
      - DB_DATABASE=projectservicedb
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - project-db

  billing-service:
    build: ./services/BillingService
    environment:
      - DB_HOST=billing-db
      - DB_DATABASE=billingservicedb
      - DB_USERNAME=root
      - DB_PASSWORD=root
    depends_on:
      - billing-db

  task-service:
    build: ./services/TaskService
    environment:
      - MONGO_URI=mongodb://task-db:27017/taskdb
      - PORT=3000
    depends_on:
      - task-db

  chat-service:
    build: ./services/ChatService
    environment:
      - MONGO_URI=mongodb://chat-db:27017/chatdb
      - PORT=4000
    depends_on:
      - chat-db

  notification-service:
    build: ./services/NotificationService
    environment:
      - MONGODB_URI=mongodb://notification-db:27017/notificationdb
      - PORT=5050
    depends_on:
      - notification-db

  # Frontend
  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_USER_SERVICE_URL=http://localhost:1010
        - NEXT_PUBLIC_PROJECT_SERVICE_URL=http://localhost:8000
        - NEXT_PUBLIC_TASK_SERVICE_URL=http://localhost:3000
        - NEXT_PUBLIC_CHAT_SERVICE_URL=http://localhost:4000
        - NEXT_PUBLIC_NOTIFICATION_SERVICE_URL=http://localhost:5050
        - NEXT_PUBLIC_BILLING_SERVICE_URL=http://localhost:6060
    expose:
      - 3000

  dashboard:
    build:
      context: ./dashboard
      args:
        - VITE_API_URL=http://localhost:8000/api
    expose:
      - 80

  # Reverse Proxy
  nginx-proxy:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx-proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - dashboard

volumes:
  user-db-data:
  project-db-data:
  billing-db-data:
  task-db-data:
  chat-db-data:
  notification-db-data:
