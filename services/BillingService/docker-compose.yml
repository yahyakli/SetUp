version: '3'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: billing-service
    container_name: billing-service
    restart: unless-stopped
    ports:
      - "6060:6060"
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - billing-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: billing-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - billing-mysql:/var/lib/mysql
    networks:
      - billing-network

networks:
  billing-network:
    driver: bridge

volumes:
  billing-mysql:
    driver: local