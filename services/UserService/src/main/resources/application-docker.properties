# Application name
spring.application.name=userservice

# Server configuration
server.port=1010

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/userservicedb?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=MzJieXRlU2VjdXJlU2VjcmV0S2V5Rm9yU0hBNjU2QWxnb3JpdGht
jwt.expiration.day=86400000
jwt.expiration.week=604800000

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Avatar upload directory (customize as needed)
app.upload.dir=/app/src/main/resources/static/uploads/avatars
app.storage.service.url=${STORAGE_SERVICE_URL:http://localhost:3030}

# Logging
logging.level.org.springframework.security=DEBUG

spring.web.resources.static-locations=classpath:/static/