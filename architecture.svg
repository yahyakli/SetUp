<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Project Management SaaS - Updated Architecture</text>
  
  <!-- Frontend Layer -->
  <rect x="50" y="70" width="700" height="80" rx="5" ry="5" fill="#4285f4" opacity="0.2" stroke="#4285f4" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">Frontend Layer</text>
  <rect x="100" y="105" width="160" height="30" rx="5" ry="5" fill="#4285f4" opacity="0.8"/>
  <text x="180" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Next.js</text>
  <rect x="320" y="105" width="160" height="30" rx="5" ry="5" fill="#4285f4" opacity="0.8"/>
  <text x="400" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Tailwind CSS + Shadcn UI</text>
  <rect x="540" y="105" width="160" height="30" rx="5" ry="5" fill="#4285f4" opacity="0.8"/>
  <text x="620" y="125" font-family="Arial" font-size="14" text-anchor="middle" fill="white">Redux + Axios</text>
  
  <!-- API Gateway -->
  <rect x="50" y="160" width="700" height="50" rx="5" ry="5" fill="#fbbc05" opacity="0.2" stroke="#fbbc05" stroke-width="2"/>
  <text x="400" y="190" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">API Gateway / Load Balancer</text>
  
  <!-- Microservices Layer -->
  <rect x="50" y="220" width="700" height="200" rx="5" ry="5" fill="#34a853" opacity="0.1" stroke="#34a853" stroke-width="2"/>
  <text x="400" y="240" font-family="Arial" font-size="18" text-anchor="middle" fill="#333" font-weight="bold">Microservices Layer</text>
  
  <!-- Individual Services -->
  <rect x="60" y="260" width="130" height="70" rx="5" ry="5" fill="#4285f4" opacity="0.7"/>
  <text x="125" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">User Service</text>
  <text x="125" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Spring</text>
  <text x="125" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MySQL</text>
  
  <rect x="200" y="260" width="130" height="70" rx="5" ry="5" fill="#0f9d58" opacity="0.7"/>
  <text x="265" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Project Service</text>
  <text x="265" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Laravel</text>
  <text x="265" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MySQL</text>
  
  <rect x="340" y="260" width="130" height="70" rx="5" ry="5" fill="#f4b400" opacity="0.7"/>
  <text x="405" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Task Service</text>
  <text x="405" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Express</text>
  <text x="405" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MongoDB</text>
  
  <rect x="480" y="260" width="130" height="70" rx="5" ry="5" fill="#db4437" opacity="0.7"/>
  <text x="545" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Chat Service</text>
  <text x="545" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Express</text>
  <text x="545" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MongoDB</text>
  
  <rect x="620" y="260" width="130" height="70" rx="5" ry="5" fill="#673ab7" opacity="0.7"/>
  <text x="685" y="285" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Notification Service</text>
  <text x="685" y="305" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Express</text>
  <text x="685" y="320" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MongoDB</text>
  
  <rect x="60" y="340" width="130" height="70" rx="5" ry="5" fill="#e91e63" opacity="0.7"/>
  <text x="125" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">File Service</text>
  <text x="125" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Laravel</text>
  <text x="125" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MySQL</text>
  
  <rect x="200" y="340" width="130" height="70" rx="5" ry="5" fill="#009688" opacity="0.7"/>
  <text x="265" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Billing Service</text>
  <text x="265" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Spring</text>
  <text x="265" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MySQL</text>
  
  <rect x="340" y="340" width="130" height="70" rx="5" ry="5" fill="#ff9800" opacity="0.7"/>
  <text x="405" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Analytics Service</text>
  <text x="405" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Spring</text>
  <text x="405" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MySQL</text>

  <!-- Payment Services -->
  <rect x="480" y="340" width="130" height="70" rx="5" ry="5" fill="#795548" opacity="0.7"/>
  <text x="545" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">Stripe Gateway</text>
  <text x="545" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Express</text>
  <text x="545" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MongoDB</text>

  <rect x="620" y="340" width="130" height="70" rx="5" ry="5" fill="#607d8b" opacity="0.7"/>
  <text x="685" y="365" font-family="Arial" font-size="12" text-anchor="middle" fill="white" font-weight="bold">PayPal Gateway</text>
  <text x="685" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Express</text>
  <text x="685" y="400" font-family="Arial" font-size="10" text-anchor="middle" fill="white">MongoDB</text>
  
  <!-- Message Broker with Arrows -->
  <rect x="50" y="430" width="700" height="120" rx="5" ry="5" fill="#ea4335" opacity="0.2" stroke="#ea4335" stroke-width="2"/>
  <text x="400" y="455" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Message Broker (RabbitMQ)</text>
  
  <!-- Event Flow Arrows -->
  <path d="M 100,480 L 650,480" stroke="#ea4335" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="375" y="475" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Event Publishing</text>
  
  <path d="M 650,520 L 100,520" stroke="#34a853" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="375" y="535" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Event Consumption</text>
  
  <!-- Arrow Marker Definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Storage Layer -->
  <rect x="50" y="560" width="700" height="30" rx="5" ry="5" fill="#9c27b0" opacity="0.1" stroke="#9c27b0" stroke-width="2"/>
  <text x="400" y="580" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Local File Storage</text>
</svg> 