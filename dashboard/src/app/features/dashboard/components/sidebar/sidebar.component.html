<aside 
  class="fixed inset-y-0 left-0 z-20 bg-white dark:bg-dark-800 shadow-md transition-all duration-300 transform lg:static lg:inset-0"
  [ngClass]="{
    'translate-x-0 w-64': isOpen, 
    '-translate-x-full w-0 lg:w-16': !isOpen
  }"
>
  <div class="h-full flex flex-col overflow-hidden">
    <!-- Logo area -->
    <div class="h-16 flex items-center justify-center border-b border-gray-200 dark:border-dark-700">
      <div class="flex items-center">
        <!-- Logo placeholder -->
        <img src="/SULogo.png" alt="Logo" class="h-10 w-10 rounded-md">
        <span class="ml-2 text-xl font-bold text-gray-900 dark:text-white" [ngClass]="{'hidden': !isOpen}">SetUp</span>
      </div>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-4 px-3">
      <ul class="space-y-1">
        <li *ngFor="let item of navItems">
          <a 
            [routerLink]="item.route" 
            routerLinkActive="bg-gray-100 dark:bg-dark-700 text-primary-500"
            class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-dark-700 transition-colors"
          >
            <span [innerHTML]="item.icon" class="flex-shrink-0 text-gray-500 dark:text-gray-400" [ngClass]="{'mr-3': isOpen}"></span>
            <span class="flex-1" [ngClass]="{'hidden': !isOpen}">{{ item.label }}</span>
            <span *ngIf="item.badge && isOpen" class="bg-primary-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
              {{ item.badge }}
            </span>
          </a>
        </li>
      </ul>
    </nav>
    
    <!-- Bottom section -->
    <div class="p-4 border-t border-gray-200 dark:border-dark-700" [ngClass]="{'hidden': !isOpen}">
      <div class="bg-gray-100 dark:bg-dark-700 rounded-md p-3">
        <div class="flex items-center">
          <div class="flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div class="ml-3">
            <p class="text-sm font-medium text-gray-900 dark:text-white">Need help?</p>
            <p class="text-xs text-gray-500 dark:text-gray-400">Check our documentation</p>
          </div>
        </div>
        <a href="#" class="mt-2 block text-center text-sm text-primary-500 hover:text-primary-600 font-medium">
          View Documentation
        </a>
      </div>
    </div>
  </div>
</aside>
