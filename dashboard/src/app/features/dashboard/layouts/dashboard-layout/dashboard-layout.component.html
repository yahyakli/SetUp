<div class="h-screen flex flex-col bg-gray-50 dark:bg-dark-900 transition-colors duration-200">
  <!-- Header -->
  <app-header 
    [isSidebarOpen]="isSidebarOpen" 
    (toggleSidebar)="toggleSidebar()">
  </app-header>
  
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <app-sidebar [isOpen]="isSidebarOpen"></app-sidebar>
    
    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6 transition-all duration-200">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
