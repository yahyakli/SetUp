<div class="space-y-6">
  <!-- Page header -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Users</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage user accounts and permissions</p>
    </div>
    <div class="mt-4 md:mt-0">
      <button class="btn-primary flex items-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
        </svg>
        Add User
      </button>
    </div>
  </div>
  
  <!-- Filters -->
  <div class="card">
    <div class="flex flex-col md:flex-row md:items-center md:space-x-4">
      <!-- Search -->
      <div class="flex-1 mb-4 md:mb-0">
        <label for="search" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Search</label>
        <div class="relative">
          <input 
            type="text" 
            id="search" 
            [(ngModel)]="searchTerm"
            (input)="applyFilters()"
            placeholder="Search by name or email" 
            class="input-field pl-10"
          >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute left-3 top-2.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
      
      <!-- Role filter -->
      <div class="mb-4 md:mb-0">
        <label for="role" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Role</label>
        <select 
          id="role" 
          [(ngModel)]="selectedRole"
          (change)="applyFilters()"
          class="input-field"
        >
          <option value="">All Roles</option>
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
      </div>
      
      <!-- Status filter -->
      <div class="mb-4 md:mb-0">
        <label for="status" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
        <select 
          id="status" 
          [(ngModel)]="selectedStatus"
          (change)="applyFilters()"
          class="input-field"
        >
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      
      <!-- Reset button -->
      <div class="flex items-end">
        <button 
          (click)="resetFilters()"
          class="btn-outline"
        >
          Reset
        </button>
      </div>
    </div>
  </div>
  
  <!-- Users table -->
  <div class="card overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 dark:divide-dark-600">
        <thead class="bg-gray-50 dark:bg-dark-800">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
              User
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
              Role
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
              Status
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
              Last Active
            </th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">
              Actions
            </th>
          </tr>
        </thead>
        <tbody class="bg-white dark:bg-dark-700 divide-y divide-gray-200 dark:divide-dark-600">
          <tr *ngFor="let user of filteredUsers" class="hover:bg-gray-50 dark:hover:bg-dark-600">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="flex items-center">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-primary-500 flex items-center justify-center text-white font-medium">
                  {{ user.avatar }}
                </div>
                <div class="ml-4">
                  <div class="text-sm font-medium text-gray-900 dark:text-white">{{ user.name }}</div>
                  <div class="text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900 dark:text-white">{{ user.role }}</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" 
                    [ngClass]="user.status === 'active' ? 'bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-300'">
                {{ user.status }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
              {{ formatDate(user.lastActive) }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              <button class="text-primary-500 hover:text-primary-600 mr-3">Edit</button>
              <button class="text-red-500 hover:text-red-600">Delete</button>
            </td>
          </tr>
          
          <!-- Empty state -->
          <tr *ngIf="filteredUsers.length === 0">
            <td colspan="5" class="px-6 py-10 text-center text-gray-500 dark:text-gray-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto mb-2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
              </svg>
              <p class="text-lg font-medium">No users found</p>
              <p class="mt-1">Try adjusting your search or filter to find what you're looking for.</p>
              <button (click)="resetFilters()" class="mt-3 btn-outline">Reset Filters</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
